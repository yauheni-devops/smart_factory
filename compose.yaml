name: smart-factory

x-api: &api
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  mem_limit: 256m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  catalog:
    <<: *api
    image: smart-factory/catalog:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile

  maintenance:
    <<: *api
    image: smart-factory/maintenance:local
    build:
      context: .
      dockerfile: services/maintenance/Dockerfile
    mem_limit: 512m
    environment:
      DATABASE_URL: sqlite:////opt/factory/data/maintenance.db
      CATALOG_URL: http://catalog:8081
      PTO_ACCESS_USERNAME: ${PTO_ACCESS_USERNAME:-pto}
      PTO_ACCESS_PASSWORD: ${PTO_ACCESS_PASSWORD:?Set PTO_ACCESS_PASSWORD in the root .env}
    volumes:
      - type: bind
        source: ./data/local/compose
        target: /opt/factory/data
        bind:
          create_host_path: false
    depends_on:
      catalog:
        condition: service_healthy

  production:
    <<: *api
    image: smart-factory/production:local
    build:
      context: .
      dockerfile: services/production/Dockerfile
    environment:
      CATALOG_URL: http://catalog:8081
    depends_on:
      catalog:
        condition: service_healthy

  telemetry:
    <<: *api
    image: smart-factory/telemetry:local
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    environment:
      CATALOG_URL: http://catalog:8081
      PRODUCTION_URL: http://production:8083
      MAINTENANCE_AUTH_URL: http://maintenance:8086
    depends_on:
      catalog:
        condition: service_healthy
      production:
        condition: service_healthy
      maintenance:
        condition: service_healthy

  simulator:
    <<: *api
    image: smart-factory/simulator:local
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      CATALOG_URL: http://catalog:8081
      TELEMETRY_URL: http://telemetry:8082
      SIMULATOR_INTERVAL_SEC: "5"
    depends_on:
      catalog:
        condition: service_healthy
      telemetry:
        condition: service_healthy

  frontend:
    <<: *api
    image: smart-factory/frontend:local
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    mem_limit: 128m
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      telemetry:
        condition: service_healthy
      maintenance:
        condition: service_healthy

  prometheus:
    <<: *api
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 15s

  grafana:
    <<: *api
    profiles: [observability]
    image: grafana/grafana:13.2.3
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint: [/bin/sh, -ec]
    command:
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "Set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s

networks:
  backend:

volumes:
  prometheus-data:
  grafana-data:
