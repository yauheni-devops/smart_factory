global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # The Python APIs are currently run on the host. Bind them to 0.0.0.0 so
  # Docker Desktop / host-gateway can scrape their /metrics endpoints.
  - job_name: factory-apis
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8081"
        labels:
          service: catalog
      - targets:
          - "host.docker.internal:8082"
        labels:
          service: telemetry
      - targets:
          - "host.docker.internal:8083"
        labels:
          service: production
      - targets:
          - "host.docker.internal:8085"
        labels:
          service: simulator
      - targets:
          - "host.docker.internal:8086"
        labels:
          service: maintenance
