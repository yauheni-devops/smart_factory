global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # API containers are scraped over the private Compose network.
  - job_name: factory-apis
    metrics_path: /metrics
    static_configs:
      - targets:
          - "catalog:8081"
        labels:
          service: catalog
      - targets:
          - "telemetry:8082"
        labels:
          service: telemetry
      - targets:
          - "production:8083"
        labels:
          service: production
      - targets:
          - "simulator:8085"
        labels:
          service: simulator
      - targets:
          - "maintenance:8086"
        labels:
          service: maintenance
