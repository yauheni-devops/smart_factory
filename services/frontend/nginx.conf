server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index landing.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $maintenance_upstream http://maintenance:8086;
    set $telemetry_upstream http://telemetry:8082;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header X-Content-Type-Options "nosniff" always;

    auth_request /auth-check;
    error_page 401 = @login_redirect;

    location = /auth-check {
        internal;
        auth_request off;
        proxy_pass $maintenance_upstream/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @login_redirect {
        auth_request off;
        return 303 /login?next=frontend;
    }
    location @api_unauthorized {
        auth_request off;
        default_type application/json;
        return 401 '{"detail":"Authentication required"}';
    }

    location = /login { auth_request off; proxy_pass $maintenance_upstream; }
    location = /logout { auth_request off; proxy_pass $maintenance_upstream; }
    location = /assets/login-background.webp { auth_request off; proxy_pass $maintenance_upstream; }

    location = / { try_files /landing.html =404; }
    location = /ui { try_files /landing.html =404; }
    location = /monitoring { try_files /index.html =404; }
    location = /production { try_files /production.html =404; }
    location = /alerts { try_files /alerts.html =404; }
    location = /documents { try_files /documents.html =404; }
    location = /reports { try_files /reports.html =404; }
    location = /ui/scheme { try_files /scheme.png /scheme.jpg =404; }

    location = /maintenance { return 308 /maintenance/ui; }
    location ^~ /maintenance/api/ {
        error_page 401 = @api_unauthorized;
        rewrite ^/maintenance/(.*)$ /$1 break;
        proxy_pass $maintenance_upstream;
    }
    location ^~ /maintenance/ {
        rewrite ^/maintenance/(.*)$ /$1 break;
        proxy_pass $maintenance_upstream;
    }

    location = /health {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /ui/data {
        error_page 401 = @api_unauthorized;
        proxy_pass $telemetry_upstream;
    }
    location = /ui/production {
        error_page 401 = @api_unauthorized;
        proxy_pass $telemetry_upstream;
    }
    location = /readings {
        error_page 401 = @api_unauthorized;
        proxy_pass $telemetry_upstream;
    }
    location ^~ /readings/ {
        error_page 401 = @api_unauthorized;
        proxy_pass $telemetry_upstream;
    }
}
