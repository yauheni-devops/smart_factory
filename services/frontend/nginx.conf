server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index landing.html;

    add_header X-Content-Type-Options "nosniff" always;

    auth_request /auth-check;
    error_page 401 = @login_redirect;

    location = /auth-check {
        internal;
        auth_request off;
        proxy_pass http://host.docker.internal:8086/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        auth_request off;
        return 303 http://$host:8086/login?next=frontend;
    }

    # Static application pages.
    location = / {
        try_files /landing.html =404;
    }

    location = /ui {
        try_files /landing.html =404;
    }

    location = /monitoring {
        try_files /index.html =404;
    }

    location = /production {
        try_files /production.html =404;
    }

    location = /alerts {
        try_files /alerts.html =404;
    }

    location = /documents {
        try_files /documents.html =404;
    }

    location = /reports {
        try_files /reports.html =404;
    }

    location = /ui/scheme {
        try_files /scheme.png /scheme.jpg =404;
    }

    location = /health {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy. The telemetry API is still run on the host for
    # this first Compose milestone; host-gateway makes it reachable from NGINX.
    location = /ui/data {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /ui/production {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        auth_request off;
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
    }

    location = /readings {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /readings/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
