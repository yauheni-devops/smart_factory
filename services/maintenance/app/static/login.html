<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в систему — завод строительных материалов</title>
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; color: #14283f; background: #edf3f7; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center start;
      padding: 20px clamp(16px, 3vw, 48px);
      /* Источник фотографии: https://cemezit.by/#fancy001-14 */
      background:
        linear-gradient(rgba(9, 34, 24, .15), rgba(9, 34, 24, .25)),
        url("/assets/login-background.webp") center / cover no-repeat;
    }
    main { width: min(100%, 420px); padding: 34px; background: #fff; border: 1px solid #dbe3ec; border-radius: 16px; box-shadow: 0 18px 55px #10243b18; }
    .eyebrow { margin: 0 0 9px; color: #176b87; font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 29px; line-height: 1.2; }
    p { color: #586b7e; line-height: 1.5; }
    label { display: block; margin: 19px 0 7px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #b9c9d7; border-radius: 8px; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #76b9d0; outline-offset: 2px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #176b87; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .error { margin: 15px 0 0; color: #b42318; min-height: 1.5em; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Завод строительных материалов</p>
    <h1>Вход в систему</h1>
    <p>Мониторинг, выпуск продукции, предупреждения и планово-техническое обслуживание доступны после входа.</p>
    <form id="login-form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const error = document.getElementById('error');
      error.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (!response.ok) {
          error.textContent = response.status === 401 ? 'Неверный логин или пароль.' : 'Вход недоступен. Проверьте настройки сервиса.';
          return;
        }
        const destination = new URLSearchParams(window.location.search).get('next');
        const port = destination === 'frontend' ? 8080 : 8082;
        const home = `${window.location.protocol}//${window.location.hostname}:${port}/ui`;
        window.location.replace(['home', 'frontend'].includes(destination) ? home : '/ui');
      } catch (_) {
        error.textContent = 'Не удалось связаться с сервисом планово-технического обслуживания.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
